[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wattscope"
version = "1.0.0"
description = "Reproducible day-ahead electricity forecasting with chronological evaluation and a forecast API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scikit-learn>=1.7,<2",
  "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
wattscope = "wattscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wattscope = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
